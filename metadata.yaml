name: cloud-mask-composite-images
author:
- name: Tevin Temu
  organization: Wildlife Dynamics
  email: tevin@wildlifedynamics.com
description: >-
  Builds a cloud-masked satellite composite (Sentinel-2 or Landsat) from Google Earth Engine for
  a region of interest taken from an EarthRanger spatial feature group over the chosen time range.
  Clouds and cloud shadows are masked, the clear pixels are combined into one image, and that
  image is saved as a GeoTIFF and shown on an interactive map over the selected base maps.
