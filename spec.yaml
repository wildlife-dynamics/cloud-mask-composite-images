id: cloud_mask_composite_images
requirements:
- name: ecoscope-platform
  version: ==2.18.0
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.0rc14
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: ==0.0.0rc1
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-mnc
  version: ==1.0.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

- name: ecoscope-workflows-ext-mep
  version: ==1.0.7
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Set Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S'

  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers: null

  - name: Connect to Google Earth Engine
    id: gee_connection
    task: set_gee_connection

  - title: Define Region of Interest
    type: task-group
    description: Define the region of interest for the aerial survey by uploading a geospatial file (GeoJSON, GeoPackage or GeoParquet) that contains the boundary of the area to be surveyed. This file will be loaded and processed to generate the survey lines.
    tasks:
      - name: null
        id: retrieve_file_params
        task: ecoscope_workflows_ext_ste.tasks.io.get_file_path
        partial: 
          output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - name: Load File 
    id: load_gdf 
    task: load_df 
    partial:
      file_path: ${{ workflow.retrieve_file_params.return }}
      layer: null
      deserialize_json: true 

  - name: Set Base Maps
    id: base_maps
    task: set_base_maps

  - name: Fix Invalid Geometries
    id: invalid_geometries
    task: fix_invalid_geometries
    partial:
      gdf: ${{ workflow.load_gdf.return }}

  - name: Reproject Gdf
    id: gdf
    task: reproject_gdf
    partial:
      gdf: ${{ workflow.invalid_geometries.return }}
      target_crs: 4326

  - name: View State From Geodataframes
    id: state_from_geodataframes
    task: ecoscope.platform.tasks.results.view_state_from_geodataframes
    partial:
      geodataframes:
      - ${{ workflow.gdf.return }}
      max_zoom: 20

  - name: Export Cloudfree Composites
    id: cloudfree_composites_2
    task: export_cloudfree_composites
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      client: ${{ workflow.gee_connection.return }}
      roi: ${{ workflow.gdf.return }}
      time_range: ${{ workflow.time_range.return }}
      scale: null
      crs: null

  - name: Composite To Bitmap Layer
    id: to_bitmap_layer
    task: composite_to_bitmap_layer
    partial:
      composite_path: ${{ workflow.cloudfree_composites_2.return }}
      vmin: null
      vmax: null
      max_size: 2048

  - name: Merge Tile Layers
    id: tile_layers
    task: ecoscope.platform.tasks.results.merge_tile_layers
    partial:
      overlay: ${{ workflow.to_bitmap_layer.return }}
      base_layers: ${{ workflow.base_maps.return }}

  - name: Draw Map
    id: composite_map
    task: ecoscope.platform.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.tile_layers.return }}
      view_state: ${{ workflow.state_from_geodataframes.return }}
      static: false
      output_type: html
      title: ''
      legend_style:
        placement: bottom-right
        format_title: false
      max_zoom: 20

  - name: Persist Text
    id: text
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.composite_map.return }}

  - name: Create Map Widget Single View
    id: map_widget_single_view
    task: create_map_widget_single_view
    partial:
      data: ${{ workflow.text.return }}
      title: Map

  - name: Gather Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      widgets:
      - ${{ workflow.map_widget_single_view.return }}
      details: ${{ workflow.workflow_details.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
